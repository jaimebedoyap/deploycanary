  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: web-canary
  spec:
    replicas: 3
    selector:
      matchLabels:
        app: mi-web
        version: v2
    template:
      metadata:
        labels:
          app: mi-web
          version: v2
      spec:
        containers:
        - name: web
          image: nginx:1.23 # Una versión más nueva
          ports:
          - containerPort: 80
          resources:
            requests:
              cpu: "250m"      # Antes tenías 500m
              memory: "512Mi"  # Antes tenías 2Gi
            limits:
              cpu: "250m"
              memory: "512Mi"
          livenessProbe:
            httpGet:            # <--- Cambiamos de 'exec' a 'httpGet'
              path: /           # Verifica la página principal
              port: 80          # En el puerto 80
            initialDelaySeconds: 15
            periodSeconds: 20
            
          readinessProbe:
            httpGet:            # <--- Cambiamos de 'exec' a 'httpGet'
              path: /           # Verifica la página principal
              port: 80          # En el puerto 80
            initialDelaySeconds: 5
            periodSeconds: 5

            