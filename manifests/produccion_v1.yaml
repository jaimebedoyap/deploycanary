apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-v1
  namespace: canary-demo
  labels:
    app: nginx
    version: v1
spec:
  replicas: 4          # 4 réplicas = 80% del tráfico
  selector:
    matchLabels:
      app: nginx       # ← Label compartido con v2 para que el Service los enrute a ambos
      version: v1
  template:
    metadata:
      labels:
        app: nginx     # ← CRÍTICO: mismo label "app: nginx" que v2
        version: v1
    spec:
      containers:
      - name: nginx
        image: nginx:1.25   # Versión estable
        ports:
        - containerPort: 80
        # ConfigMap que personaliza la página de Nginx para identificar la versión
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"
        # Liveness probe: reinicia el pod si Nginx deja de responder
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        # Readiness probe: solo envía tráfico cuando el pod está listo
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5
      volumes:
      - name: html
        configMap:
          name: nginx-v1-html  # HTML personalizado para identificar v1
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-v1-html
  namespace: canary-demo
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>Nginx - Versión 1</title>
      <style>
        body {
          font-family: Arial, sans-serif;
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
          margin: 0;
          background-color: #1a73e8;
          color: white;
        }
        .card {
          text-align: center;
          padding: 40px;
          background: rgba(255,255,255,0.15);
          border-radius: 16px;
          backdrop-filter: blur(10px);
        }
        h1 { font-size: 3em; margin: 0; }
        p  { font-size: 1.2em; margin-top: 10px; opacity: 0.9; }
        .badge {
          display: inline-block;
          background: white;
          color: #1a73e8;
          padding: 6px 20px;
          border-radius: 20px;
          font-weight: bold;
          margin-top: 16px;
        }
      </style>
    </head>
    <body>
      <div class="card">
        <h1>🚀 Versión 1</h1>
        <p>Producción estable</p>
        <div class="badge">STABLE</div>
        <p style="margin-top:24px; font-size:0.9em;">Pod: $HOSTNAME</p>
      </div>
    </body>
    </html>