apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mi-web
      version: v1
  template:
    metadata:
      labels:
        app: mi-web
        version: v1
    spec:
      containers:
      - name: web
        image: nginx:1.21
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "25m"      # Antes tenías 500m
            memory: "64Mi"  # Antes tenías 2Gi
          limits:
            cpu: "200m"
            memory: "256Mi"