name: GKE Deployment Pipeline

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build and Deploy to GKE
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - id: auth
      name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ secrets.GCP_SA_EMAIL }}
        project_id: proyecto-prueba-12345-495621

    - name: Set up GKE Credentials
      uses: google-github-actions/get-gke-credentials@v2
      with:
        cluster_name: cluster-devops
        location: us-central1-a
        project_id: proyecto-prueba-12345-495621

    - name: Deploy Namespace
      run: kubectl apply -f manifests/namespace.yaml

    - name: Deploy v1 (Producción estable - 80% tráfico)
      run: kubectl apply -f manifests/produccion_v1.yaml

    - name: Deploy v2 (Canary - 20% tráfico)
      run: kubectl apply -f manifests/canary_v2.yaml

    - name: Deploy LoadBalancer Service
      run: kubectl apply -f manifests/loadbalancer.yaml

    - name: Verificar despliegue
      run: |
        echo "=== Pods desplegados ==="
        kubectl get pods -n canary-demo -l app=nginx

        echo ""
        echo "=== Distribución de tráfico ==="
        V1=$(kubectl get pods -n canary-demo -l version=v1 --no-headers | wc -l)
        V2=$(kubectl get pods -n canary-demo -l version=v2 --no-headers | wc -l)
        TOTAL=$((V1 + V2))
        echo "v1 (estable): $V1 pods → $((V1 * 100 / TOTAL))% del tráfico"
        echo "v2 (canary):  $V2 pods → $((V2 * 100 / TOTAL))% del tráfico"

        echo ""
        echo "=== IP del LoadBalancer ==="
        kubectl get service nginx-service -n canary-demo
