apiVersion: v1
kind: Service
metadata:
  name: nginx-bg-service
  namespace: bluegreen-demo
  labels:
    app: nginx
  annotations:
    # Documenta el ambiente activo actual
    deployment/active-slot: "blue"
spec:
  type: LoadBalancer
  selector:
    app: nginx
    slot: blue     # ← CLAVE: cambiar "blue" por "green" hace el switch instantáneo
                   #   kubectl patch service nginx-bg-service -n bluegreen-demo
                   #   -p '{"spec":{"selector":{"app":"nginx","slot":"green"}}}'
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 80