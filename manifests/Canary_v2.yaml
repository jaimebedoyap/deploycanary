apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-v2
  namespace: canary-demo
  labels:
    app: nginx
    version: v2
spec:
  replicas: 1          # 1 réplica = 20% del tráfico (1 de cada 5 pods)
  selector:
    matchLabels:
      app: nginx       # ← Label compartido con v1 para que el Service los enrute a ambos
      version: v2
  template:
    metadata:
      labels:
        app: nginx     # ← CRÍTICO: mismo label "app: nginx" que v1
        version: v2
    spec:
      containers:
      - name: nginx
        image: nginx:1.27   # Nueva versión a validar
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5
      volumes:
      - name: html
        configMap:
          name: nginx-v2-html  # HTML personalizado para identificar v2
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-v2-html
  namespace: canary-demo
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>Nginx - Versión 2</title>
      <style>
        body {
          font-family: Arial, sans-serif;
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
          margin: 0;
          background-color: #f9a825;
          color: white;
        }
        .card {
          text-align: center;
          padding: 40px;
          background: rgba(255,255,255,0.15);
          border-radius: 16px;
          backdrop-filter: blur(10px);
        }
        h1 { font-size: 3em; margin: 0; }
        p  { font-size: 1.2em; margin-top: 10px; opacity: 0.9; }
        .badge {
          display: inline-block;
          background: white;
          color: #f9a825;
          padding: 6px 20px;
          border-radius: 20px;
          font-weight: bold;
          margin-top: 16px;
        }
      </style>
    </head>
    <body>
      <div class="card">
        <h1>🐤 Versión 2</h1>
        <p>Canary — en validación</p>
        <div class="badge">CANARY</div>
        <p style="margin-top:24px; font-size:0.9em;">Pod: $HOSTNAME</p>
      </div>
    </body>
    </html>